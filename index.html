<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEDANKEN 3000</title>
  <meta name="description" content="GEDANKEN 3000 – ein fortlaufendes Gedankenarchiv von Nils Hausotte." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Fixed Header -->
  <header id="site-header">
    <h1 id="site-title">GEDANKEN 3000</h1>
    <p id="entry-counter"><span id="counter-number">0</span> and counting</p>
  </header>

  <!-- Main scrollable content -->
  <div id="page-content">

    <!-- Blog entries (injected by JS) -->
    <main id="credits-track" role="main" aria-label="Gedanken-Einträge"></main>

    <!-- Impressum -->
    <footer id="impressum" aria-label="Impressum">
      <h2>Impressum</h2>
      <p>
        Nils Hausotte<br />
        <br />
        Alle Texte sind persönliche Gedanken und keine redaktionellen Inhalte.<br />
        Kontakt auf Anfrage.
      </p>
    </footer>

  </div>

  <script src="entries.js"></script>
  <script src="main.js"></script>
</body>

</html>
